name: PR Check

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/reusable-build.yml
    with:
      run-tests: true
      run-build: true

  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
      - name: Check coverage thresholds
        run: |
          npx nyc report --reporter=json-summary
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "❌ Coverage is below 90% threshold"
            exit 1
          else
            echo "✅ Coverage meets 90% threshold"
          fi

  size-check:
    name: Build Size Check
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/
      - name: Check build sizes
        run: |
          minified_size=$(stat -c%s dist/chaipe.min.js)
          max_size=$((50 * 1024)) # 50KB
          if [ $minified_size -gt $max_size ]; then
            echo "❌ Minified build exceeds 50KB limit"
            exit 1
          else
            echo "✅ Minified build is under 50KB"
          fi
