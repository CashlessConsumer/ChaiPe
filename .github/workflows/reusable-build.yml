name: Reusable Setup and Build

on:
  workflow_call:
    inputs:
      run-tests:
        description: 'Whether to run tests'
        required: false
        type: boolean
        default: false
      run-build:
        description: 'Whether to build the project'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Setup, Cache, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: npm test -- --coverage

      - name: Upload coverage artifact
        if: ${{ inputs.run-tests }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 1

      - name: Build project
        if: ${{ inputs.run-build }}
        run: npm run build

      - name: Upload build artifacts
        if: ${{ inputs.run-build }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1
